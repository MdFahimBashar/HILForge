name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hilforge
          POSTGRES_USER: hilforge
          POSTGRES_PASSWORD: hilforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hilforge -d hilforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      HILFORGE_ENVIRONMENT: test
      HILFORGE_LOG_LEVEL: INFO
      HILFORGE_DATABASE_URL: postgresql+psycopg://hilforge:hilforge@127.0.0.1:5432/hilforge
      HILFORGE_REDIS_URL: redis://127.0.0.1:6379/0
      HILFORGE_RUN_SERVICE_TESTS: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Apply and verify database migrations
        run: |
          alembic upgrade head
          alembic check
          python -m hilforge.db.seed
          python -m hilforge.db.seed

      - name: Lint and check formatting
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check
        run: mypy src

      - name: Test
        run: pytest -W error

  docker-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start the complete stack
        run: docker compose up --build --detach --wait

      - name: Verify healthy, unreliable, and timeout paths
        run: python scripts/verify_e2e.py --timeout 90

      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

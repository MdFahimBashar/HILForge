name: pulsehunter

x-app-environment: &app-environment
  PULSEHUNTER_ENVIRONMENT: ${PULSEHUNTER_ENVIRONMENT:-development}
  PULSEHUNTER_LOG_LEVEL: ${PULSEHUNTER_LOG_LEVEL:-INFO}
  PULSEHUNTER_DATABASE_URL: ${PULSEHUNTER_DATABASE_URL:-postgresql+psycopg://pulsehunter:pulsehunter@postgres:5432/pulsehunter}
  PULSEHUNTER_REDIS_URL: ${PULSEHUNTER_REDIS_URL:-redis://redis:6379/0}
  PULSEHUNTER_JOB_TIMEOUT_SECONDS: ${PULSEHUNTER_JOB_TIMEOUT_SECONDS:-3}
  PULSEHUNTER_JOB_MAX_ATTEMPTS: ${PULSEHUNTER_JOB_MAX_ATTEMPTS:-3}
  PULSEHUNTER_RETRY_BACKOFF_SECONDS: ${PULSEHUNTER_RETRY_BACKOFF_SECONDS:-1}
  PULSEHUNTER_RETRY_BACKOFF_MAX_SECONDS: ${PULSEHUNTER_RETRY_BACKOFF_MAX_SECONDS:-10}
  PULSEHUNTER_JOB_LEASE_GRACE_SECONDS: ${PULSEHUNTER_JOB_LEASE_GRACE_SECONDS:-5}
  PULSEHUNTER_HEARTBEAT_TIMEOUT_SECONDS: ${PULSEHUNTER_HEARTBEAT_TIMEOUT_SECONDS:-10}
  PULSEHUNTER_HEARTBEAT_SCAN_INTERVAL_SECONDS: ${PULSEHUNTER_HEARTBEAT_SCAN_INTERVAL_SECONDS:-3}
  PULSEHUNTER_RECONCILE_INTERVAL_SECONDS: ${PULSEHUNTER_RECONCILE_INTERVAL_SECONDS:-2}

x-app: &app
  image: pulsehunter:${PULSEHUNTER_IMAGE_TAG:-local}
  build:
    context: .
    target: runtime
  environment:
    <<: *app-environment
  init: true
  restart: unless-stopped

x-agent: &agent
  <<: *app
  command: ["uvicorn", "pulsehunter.agent.app:app", "--host", "0.0.0.0", "--port", "9000"]
  depends_on:
    api:
      condition: service_healthy
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3).read()"
    interval: 5s
    timeout: 4s
    retries: 20
    start_period: 5s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulsehunter}
      POSTGRES_USER: ${POSTGRES_USER:-pulsehunter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsehunter}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && python -m pulsehunter.db.seed"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "pulsehunter.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${PULSEHUNTER_API_BIND:-127.0.0.1}:${PULSEHUNTER_API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 5s

  worker:
    <<: *app
    command:
      - celery
      - -A
      - pulsehunter.tasks.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=4
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command:
      - celery
      - -A
      - pulsehunter.tasks.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  agent-healthy:
    <<: *agent
    environment:
      <<: *app-environment
      PULSEHUNTER_AGENT_NAME: sim-healthy
      PULSEHUNTER_AGENT_MODE: healthy
      PULSEHUNTER_AGENT_PUBLIC_URL: http://agent-healthy:9000
      PULSEHUNTER_AGENT_SERVER_URL: http://api:8000
      PULSEHUNTER_AGENT_EXECUTION_SECONDS: 0.4

  agent-slow:
    <<: *agent
    environment:
      <<: *app-environment
      PULSEHUNTER_AGENT_NAME: sim-slow
      PULSEHUNTER_AGENT_MODE: slow
      PULSEHUNTER_AGENT_PUBLIC_URL: http://agent-slow:9000
      PULSEHUNTER_AGENT_SERVER_URL: http://api:8000
      PULSEHUNTER_AGENT_EXECUTION_SECONDS: 20

  agent-unreliable:
    <<: *agent
    environment:
      <<: *app-environment
      PULSEHUNTER_AGENT_NAME: sim-unreliable
      PULSEHUNTER_AGENT_MODE: unreliable
      PULSEHUNTER_AGENT_PUBLIC_URL: http://agent-unreliable:9000
      PULSEHUNTER_AGENT_SERVER_URL: http://api:8000
      PULSEHUNTER_AGENT_EXECUTION_SECONDS: 0.4
      PULSEHUNTER_AGENT_OUTCOME_SCRIPT: transient,pass

volumes:
  postgres-data:
  redis-data:
